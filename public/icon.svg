<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92EEFF" />
      <stop offset="50%" stop-color="#30AFFF" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="wingGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#DDF6FF" />
      <stop offset="70%" stop-color="#30AFFF" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="wingGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDF6FF" />
      <stop offset="50%" stop-color="#30AFFF" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="wingGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92EEFF" />
      <stop offset="60%" stop-color="#30AFFF" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="vLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#92EEFF" />
      <stop offset="100%" stop-color="#30AFFF" />
    </linearGradient>

    <linearGradient id="vDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30AFFF" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Crest -->
  <path
    d="M 50 12 L 86 23 C 86 58 73 76 50 89 C 27 76 14 58 14 23 Z"
    stroke="url(#shieldBorderGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="#071828"
  />

  <!-- Inner Shield Bevel Line -->
  <path
    d="M 50 17 L 81 27 C 81 55 70 71 50 83 C 30 71 19 55 19 27 Z"
    stroke="url(#shieldBorderGrad)"
    stroke-width="1.2"
    stroke-opacity="0.45"
    fill="none"
  />

  <!-- Left Wing -->
  <path
    d="M 42 33 C 32 23 24 21 17 21 C 25 28 32 34 39 38 L 42 33 Z"
    fill="url(#wingGrad1)"
    stroke="url(#shieldBorderGrad)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
  <path
    d="M 43 41 C 34 33 28 32 22 32 C 30 39 36 44 42 47 L 43 41 Z"
    fill="url(#wingGrad2)"
    stroke="url(#shieldBorderGrad)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
  <path
    d="M 45 49 C 38 44 33 43 28 43 C 35 49 40 54 46 56 L 45 49 Z"
    fill="url(#wingGrad3)"
    stroke="url(#shieldBorderGrad)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- Right Wing -->
  <path
    d="M 58 33 C 68 23 76 21 83 21 C 75 28 68 34 61 38 L 58 33 Z"
    fill="url(#wingGrad1)"
    stroke="url(#shieldBorderGrad)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
  <path
    d="M 57 41 C 66 33 72 32 78 32 C 70 39 64 44 58 47 L 57 41 Z"
    fill="url(#wingGrad2)"
    stroke="url(#shieldBorderGrad)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
  <path
    d="M 55 49 C 62 44 67 43 72 43 C 65 49 60 54 54 56 L 55 49 Z"
    fill="url(#wingGrad3)"
    stroke="url(#shieldBorderGrad)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- Center 3D Faceted Chevron V -->
  <path
    d="M 50 71 L 36 31 L 43 31 L 50 50 Z"
    fill="url(#vLightGrad)"
    stroke="url(#shieldBorderGrad)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
  <path
    d="M 50 71 L 64 31 L 57 31 L 50 50 Z"
    fill="url(#vDarkGrad)"
    stroke="url(#shieldBorderGrad)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- Center 3D Ridge Highlight -->
  <path
    d="M 50 50 L 50 71"
    stroke="#FFFFFF"
    stroke-width="1.2"
    stroke-linecap="round"
  />
</svg>
